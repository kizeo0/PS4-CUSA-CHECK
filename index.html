<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070908">
<title>CUSA CHECK — Consulta el idioma de tu juego</title>
<meta name="description" content="Consulta por CUSA o nombre qué idiomas trae cada juego PS4.">
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:#070908;color:#e8f0e9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;line-height:1.5}
.top{border-bottom:1px solid #16241a;background:#0a0d0b}
.top .in{max-width:760px;margin:0 auto;padding:26px 16px 18px;text-align:center}
h1{font-size:2.4rem;margin:0;font-weight:800;letter-spacing:.5px;color:#f0fdf4;line-height:1.1}
h1 .gr{color:#22c55e}
.sub{margin:8px 0 0;color:#9fb3a4;font-size:1rem}
.wrap{max-width:760px;margin:0 auto;padding:14px 12px 48px}
.search{background:#0d120e;border:1px solid #1c2b20;border-radius:12px;padding:12px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;border:1px solid #243627;border-radius:9px;padding:12px;font-size:16px;background:#070908;color:#e8f0e9}
input::placeholder{color:#5c6f61}
input:focus{outline:2px solid #22c55e44;border-color:#22c55e}
button{border:1px solid transparent;border-radius:9px;padding:12px 16px;font-size:.95rem;font-weight:600;cursor:pointer;background:#22c55e;color:#04120a;min-height:48px}
button:active{transform:translateY(1px)}
button.ghost{background:transparent;color:#86efac;border-color:#243627}
.status{font-size:.82rem;color:#86efac;min-height:1.2em;margin:8px 2px 0}
.hint{font-size:.8rem;color:#7d8f83;margin:6px 2px 0}
.hint code{background:#0d120e;border:1px solid #1c2b20;border-radius:6px;padding:0 5px;font-size:.78rem;color:#bbf7d0}
.meta-line{font-size:.8rem;color:#7d8f83;margin:12px 2px}
#out{display:grid;gap:10px;margin-top:10px}
.card{background:#0d120e;border:1px solid #1c2b20;border-radius:12px;padding:14px}
.card h2{margin:0;font-size:1.02rem;line-height:1.35;color:#f0fdf4}
.result{display:flex;gap:12px}

.cusa{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;background:#0a1f12;border:1px solid #22c55e55;border-radius:6px;padding:1px 7px;display:inline-block;margin-top:6px;color:#86efac}
.tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}

.lang{margin-top:10px;border-top:1px solid #16241a;padding-top:10px}
.lang h3{margin:0 0 2px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#5c6f61;font-weight:700}

.mut{color:#7d8f83;font-size:.82rem}
details{margin-top:10px;border-top:1px solid #16241a;padding-top:8px}
summary{cursor:pointer;color:#86efac;font-size:.83rem}
pre.exact{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;background:#070908;border:1px solid #1c2b20;border-radius:8px;padding:8px;overflow-wrap:anywhere;margin:8px 0 0;color:#c9d8cc}
a{color:#4ade80}
.list-row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.list-row .nm{min-width:0}
.list-row .nm b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f0fdf4}
.list-row .nm span{font-size:.75rem;color:#5c6f61}
.btn-sm{padding:10px 14px;min-height:44px;font-size:.88rem;white-space:nowrap}
footer{margin-top:18px;color:#5c6f61;font-size:.78rem;text-align:center}
@media(max-width:560px){
  .top .in{padding:20px 12px 14px}
  h1{font-size:1.9rem}
  .wrap{padding:10px 8px 40px}
  .row{flex-direction:column}
  button{width:100%}
  .result img{width:64px;height:82px}
}
</style>
</head>
<body>
<header class="top"><div class="in">
<h1>CUSA <span class="gr">CHECK</span></h1>
<p class="sub">Consulta el idioma de tu juego</p>
</div></header>
<main class="wrap">
<div class="search">
<div class="row">
<input id="q" type="text" placeholder="CUSA43772 · 43772 · Mortuary" autocomplete="off" spellcheck="false" enterkeyhint="search">
<button id="go">Consultar</button>
<button id="clear" class="ghost">Limpiar</button>
</div>
<div class="status" id="liveStatus"></div>
<div class="hint">En vivo. Pulsa Enter para buscar.</div>
</div>
<div class="meta-line" id="stats"></div>
<div id="out"></div>
<footer><div id="foot">Cargando lista…</div></footer>
</main>
<script>
let ROWS = [];
let BY_CUSA = new Map();
let JUEGOS = [];

function normCusa(s){
  if(!s) return "";
  s = s.toUpperCase().trim().replace(/[\s\-_]/g,"");
  if(/^\d{5}$/.test(s)) return "CUSA"+s;
  let m = s.match(/(CUSA|PLAS|PCAS|PLJM|PCJS|PPSA|PPAS)\D*(\d{5})/);
  if(m) return m[1]+m[2];
  return s;
}
function esc(s){return (s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function tagES(r){
  if(r.es_en_voz) return '<span class="tag ok-voz">Español · doblaje</span>';
  if(r.es_en_textos) return '<span class="tag ok-txt">Español · textos</span>';
  if(r.es_any) return '<span class="tag ok-txt">Español · revisar</span>';
  return '<span class="tag no">Sin español</span>';
}
function renderStats(){
  document.getElementById("stats").textContent = JUEGOS.length ? JUEGOS.length+" juegos en lista" + (BY_CUSA.size ? " · "+BY_CUSA.size+" CUSA en caché" : "") : "";
}
function groupByCusa(rows){
  const m = new Map();
  rows.forEach(r=>{ const k=r.cusa||"(sin CUSA)"; if(!m.has(k)) m.set(k,[]); m.get(k).push(r); });
  return m;
}
function renderResults(list, query){
  const out = document.getElementById("out");
  if(!list.length){
    const nc = normCusa(query||"");
    out.innerHTML = '<div class="card"><h2>Sin resultados para “'+esc(query)+'”</h2>'
      +'<p class="mut">Prueba con el CUSA completo (CUSA43772) o con una palabra del título. En local: <code>py verify_cusa.py --search '+esc(nc||query)+'</code></p></div>';
    return;
  }
  const g = groupByCusa(list);
  let html = "";
  for(const [cusa, arr] of g){
    const p = arr[0];
    const voces=[...new Set(arr.map(a=>a.voice).filter(Boolean))];
    const txts=[...new Set(arr.map(a=>a.screen_languages).filter(Boolean))];
    const juegos=[...new Set(arr.map(a=>a.juego).filter(Boolean))];
    const urls=[...new Set(arr.map(a=>a.url).filter(Boolean))];
    const cover=(arr.map(a=>a.cover).find(Boolean))||"";
    html += '<article class="card"><div class="result">';
    if(cover) html += '<img src="'+esc(cover)+'" alt="" loading="lazy" referrerpolicy="no-referrer">';
    html += '<div class="tt"><h2>'+esc(juegos[0]||cusa)+'</h2>'
      +'<span class="cusa">'+esc(cusa)+' · '+esc(p.region||"?")+'</span>'
      +'<div class="tags">'+tagES(p)+'<span class="tag reg">'+esc(p.region||"?")+'</span></div>'
      +'</div></div>'
      +'<div class="lang"><h3>Voces</h3><p>'+(voces.length?esc(voces.join(" · ")):'<span class="mut">No indicado — revisar ficha</span>')+'</p></div>'
      +'<div class="lang"><h3>Textos</h3><p>'+(txts.length?esc(txts.join(" · ")):'<span class="mut">No indicado — revisar ficha</span>')+'</p></div>'
      +'<details><summary>Detalle por bloque ('+arr.length+')</summary>';
    arr.forEach((r,i)=>{
      html += '<pre class="exact">'+esc(r.cusa)+' – '+esc(r.region)+' '+esc(r.uploader||"")+'\nVoz: '+esc(r.voice||"—")+'\nTexto: '+esc(r.screen_languages||"—")+'\n'+esc(r.es_resumen||"")+'</pre>';
    });
    html += '<p class="mut">Fuente: '+urls.map(u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener">ficha</a>').join(" · ")+'</p></details></article>';
  }
  out.innerHTML = html;
}
function buscar(){
  const q = document.getElementById("q").value.trim();
  if(!q) return;
  const nc = normCusa(q);
  const isCusa = /^CUSA|^PLAS|^PCAS|^PLJM|^PCJS|^PPSA/i.test(nc) || /^\d{5}$/.test(q);
  if(isCusa){ buscarEnVivo(); return; }
  const low = q.toLowerCase();
  const hits = JUEGOS.filter(j=>(j.juego||"").toLowerCase().includes(low)).slice(0,30);
  renderGameList(hits, q);
  try{ history.replaceState(null,"","#"+encodeURIComponent(q)); }catch(e){}
}
function renderGameList(hits, q){
  const out = document.getElementById("out");
  if(!hits.length){ renderResults([], q); return; }
  let html = '<div class="card"><h2>'+hits.length+' resultados</h2><p class="mut">Toca Ver para cargar idiomas en vivo.</p></div>';
  hits.forEach(h=>{
    html += '<div class="card"><div class="list-row"><div class="nm"><b>'+esc(h.juego)+'</b><span>'+esc(h.url)+'</span></div>'
      +'<button class="btn-sm" onclick="verJuego(\''+esc(h.url).replace(/'/g,"%27")+'\')">Ver</button></div></div>';
  });
  out.innerHTML = html;
}
async function verJuego(url){
  const st = document.getElementById("liveStatus"), out = document.getElementById("out");
  try{
    if(st) st.textContent = "Cargando ficha…";
    const html = await fetchTextLive(url);
    const parsed = parseGameLive(html, url, null);
    if(!parsed.bloques.length){
      out.innerHTML = '<div class="card"><h2>'+esc(parsed.title)+'</h2><p class="mut">Sin sección CUSA. <a href="'+esc(url)+'" target="_blank" rel="noopener">Abrir original</a></p></div>';
      if(st) st.textContent = "";
      return;
    }
    if(st) st.textContent = parsed.title+" · "+parsed.bloques.length+" bloque(s)";
    renderResults(parsed.bloques, parsed.title);
    setTimeout(()=>{ if(st) st.textContent=""; },4000);
  }catch(e){
    if(st) st.textContent = "No se pudo cargar ("+e.message+")";
    out.innerHTML = '<div class="card"><h2>No se pudo cargar</h2><p class="mut">'+esc(e.message)+' — <a href="'+esc(url)+'" target="_blank" rel="noopener">abrir original</a></p></div>';
  }
}

/* ===== En vivo ===== */
const SKIP_HREF = ["/category/","list-all","list-game","/daily-update","/guide-","/dmca","/contact"];
const REGIONES = new Set(["EUR","USA","US","EU","PAL","NTSC","ASIA","AS","JPN","JP","JAP","KOR","KOREA","CHN","CHINA","HK","HKG","TW","TWN","UK","UE","EUROPA","AMERICA","LATAM"]);
const VOICE_L = ["voice","voices","voise","voises","voi","vois","void","voids","audio","audios","dub","dubs","dubbed","doblaje","doblado","voz","voces","vocal","sound","speech"];
const SCREEN_L = ["screen languages","screen language","screen","subtitles","subtitle","subs","sub","texts","text","text languages","written","languages","language","lenguages","lenguage","idiomas","idioma","langue","langues","menus","interface"];
const ALL_L_RE = new RegExp("\\b("+[...VOICE_L,...SCREEN_L].sort((a,b)=>b.length-a.length).join("|")+")\\s*[:\uFF1A]\\s*","gi");
function workerBase(){
  try{
    const p = new URLSearchParams(location.search).get("worker");
    if(p){localStorage.setItem("cusa_worker",p);}
    return localStorage.getItem("cusa_worker")||"";
  }catch(e){return "";}
}
async function fetchTextLive(target){
  const st = document.getElementById("liveStatus");
  const wb = workerBase();
  const tries = [];
  if(wb) tries.push(wb.replace(/\/$/,"")+"?url="+encodeURIComponent(target));
  tries.push("https://api.allorigins.win/raw?url="+encodeURIComponent(target));
  tries.push("https://corsproxy.io/?url="+encodeURIComponent(target));
  let err=null;
  for(const u of tries){
    try{
      if(st) st.textContent = "Consultando…";
      const r = await fetch(u);
      if(!r.ok) throw new Error("HTTP "+r.status);
      const t = await r.text();
      if(t && t.length>2000) return t;
      throw new Error("vacía");
    }catch(e){err=e;}
  }
  throw err||new Error("proxy");
}
function b64ToText(b64){
  b64=(""+b64).trim().replace(/\s+/g,"");
  while(b64.length%4) b64+="=";
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  try{return new TextDecoder("utf-8").decode(bytes);}catch(e){return bin;}
}
function cleanVal(v){
  v=(""+v).replace(/\s+/g," ").trim().replace(/^[,;|\-–—\s]+|[,;|\-–—\s]+$/g,"");
  v=v.split(/\(?\s*Guide Download/i)[0].split(/\(?\s*Tool Download/i)[0].split(/\bPassword\s*:/i)[0].split(/\bPasword\s*:/i)[0].split(/\bTnx to\b/i)[0];
  return v.split(",").map(s=>s.trim()).filter(s=>{
    const p=s.replace(/^[.\s;|()[\]]+|[.\s;|()[\]]+$/g,"");
    if(p.length<2) return false;
    if(/^(vv?|xx?|oo?)$/i.test(p)) return false;
    return true;
  }).join(", ").trim();
}
function labelKind(l){ l=(""+l).toLowerCase().replace(/\s+/g," ").trim(); return VOICE_L.includes(l)?"voice":"screen"; }
function extractLive(decodedHtml){
  const doc=new DOMParser().parseFromString(decodedHtml,"text/html");
  doc.querySelectorAll("br").forEach(br=>br.replaceWith(doc.createTextNode("\n")));
  let plain=doc.body?doc.body.textContent:"";
  plain=plain.replace(/\|/g,"\n");
  const voice=[],screen=[];
  ALL_L_RE.lastIndex=0;
  const ms=[...plain.matchAll(ALL_L_RE)];
  for(let i=0;i<ms.length;i++){
    const label=ms[i][1];
    const s=ms[i].index+ms[i][0].length;
    const e=(i+1<ms.length)?ms[i+1].index:plain.length;
    let val=cleanVal(plain.slice(s,e).split("\n")[0]||"");
    if(!val||val.length<2) continue;
    if(/^(dlpsgame|downloadgameps3|guide|tool|multi)$/i.test(val)) continue;
    (labelKind(label)==="voice"?voice:screen).push(val);
  }
  return {voice:[...new Set(voice)].join(", "),screen:[...new Set(screen)].join(", ")};
}
function esFlagsLive(voice,screen){
  const low=((voice||"")+"\n"+(screen||"")).toLowerCase();
  const vl=(voice||"").toLowerCase(), sl=(screen||"").toLowerCase();
  const T=["spanish","español","espanol","españa","espana","castellano"];
  const any=T.some(t=>low.includes(t));
  const inV=T.some(t=>vl.includes(t)), inS=T.some(t=>sl.includes(t));
  let r="Sin español";
  if(inV&&(vl.includes("spain")||vl.includes("españa")||vl.includes("espana"))) r="ES doblaje España";
  else if(inV&&(vl.includes("mexico")||vl.includes("méxico")||vl.includes("latin"))) r="ES doblaje Mexicano/Latino";
  else if(inV) r="ES doblaje";
  else if(inS&&(sl.includes("spain")||sl.includes("españa")||sl.includes("espana"))) r="ES textos España";
  else if(inS&&(sl.includes("mexico")||sl.includes("méxico"))) r="ES textos México";
  else if(inS) r="ES textos";
  return {es_any:any,es_spain:low.includes("spain")||low.includes("españa"),es_mexico:low.includes("mexico")||low.includes("latin"),es_en_voz:inV,es_en_textos:inS,es_resumen:r};
}
function parseHeadersLive(root){
  const hs=[];
  root.querySelectorAll("p,h2,h3").forEach(p=>{
    if(p.closest("div.secure-data")) return;
    const txt=(p.textContent||"").replace(/\s+/g," ").trim();
    if(!/^(CUSA|PLAS|PCAS|PLJM|PCJS|PPSA|PPAS)\s*-?\s*\d{5}/i.test(txt)) return;
    const m=txt.match(/((?:CUSA|PLAS|PCAS|PLJM|PCJS|PPSA|PPAS)\s*-?\s*\d{5})\s*[–\-—:]?\s*([A-Za-z]{2,4})?\s*(.*)/i);
    if(!m) return;
    const cusa=m[1].replace(/[\s\-]/g,"").toUpperCase();
    const region=(m[2]||"").toUpperCase();
    if(region&&!REGIONES.has(region)) return;
    const rest=(m[3]||"").slice(0,120);
    if(!region&&rest&&(rest.split(/\s+/).length>6||/^(Works|Please|can you|Do I|This is|Este es)/i.test(rest))) return;
    hs.push({header_text:txt,cusa,region,uploader:rest});
  });
  return hs;
}
function innerCusaLive(d){
  const t=new DOMParser().parseFromString(d,"text/html").body.textContent||"";
  const m=t.match(/\b((?:CUSA|PLAS|PCAS|PLJM|PCJS|PPSA|PPAS)\s*-?\s*\d{5})\s*[–\-—]?\s*([A-Za-z]{2,4})?/i);
  if(!m) return ["",""];
  let r=(m[2]||"").toUpperCase();
  if(r&&!REGIONES.has(r)) r="";
  return [m[1].replace(/[\s\-]/g,"").toUpperCase(),r];
}
function parseGameLive(html,url,wanted){
  const doc=new DOMParser().parseFromString(html,"text/html");
  const h1=doc.querySelector("h1");
  const title=h1?h1.textContent.trim():url;
  let cover="";
  const og=doc.querySelector('meta[property="og:image"]');
  if(og&&og.getAttribute("content")) cover=og.getAttribute("content");
  if(!cover){
    const post0=doc.querySelector("div.post-body, div.entry-content");
    const im=post0?post0.querySelector("img[src]"):doc.querySelector("img[src]");
    if(im) cover=im.getAttribute("src")||"";
  }
  try{ if(cover&&cover.startsWith("//")) cover="https:"+cover; }catch(e){}
  const post=doc.querySelector("div.post-body, div.entry-content")||doc;
  const headers=parseHeadersLive(post);
  const bloques=[];
  [...doc.querySelectorAll("div.secure-data[data-payload]")].forEach((d,i)=>{
    let dec=""; try{dec=b64ToText(d.getAttribute("data-payload")||"");}catch(e){}
    const vs=dec?extractLive(dec):{voice:"",screen:""};
    const ic=dec?innerCusaLive(dec):["",""];
    const o=headers[i]||{header_text:"",cusa:"",region:"",uploader:""};
    const fl=esFlagsLive(vs.voice,vs.screen);
    bloques.push({juego:title,url,bloque:i+1,cusa:o.cusa||ic[0],region:o.region||ic[1],uploader:o.uploader||"",voice:vs.voice,screen_languages:vs.screen,cover,es_resumen:fl.es_resumen,es_any:fl.es_any,es_spain:fl.es_spain,es_mexico:fl.es_mexico,es_en_voz:fl.es_en_voz,es_en_textos:fl.es_en_textos});
  });
  return {title,url,cover,bloques,filtrados:wanted?bloques.filter(b=>b.cusa===wanted):bloques};
}
async function buscarEnVivo(){
  const q=document.getElementById("q").value.trim();
  const nc=normCusa(q);
  const st=document.getElementById("liveStatus"), out=document.getElementById("out");
  if(!/^CUSA|^PLAS|^PCAS|^PLJM|^PCJS|^PPSA/i.test(nc)){
    if(st) st.textContent="Escribe un CUSA para en vivo.";
    return;
  }
  try{
    if(st) st.textContent="Buscando "+nc+"…";
    const sHtml=await fetchTextLive("https://dlpsgame.com/?s="+encodeURIComponent(nc));
    const sDoc=new DOMParser().parseFromString(sHtml,"text/html");
    const cands=[];
    sDoc.querySelectorAll("h2 a, h3 a").forEach(a=>{
      const href=a.href||a.getAttribute("href")||"";
      if(!href.includes("dlpsgame.com")) return;
      if(SKIP_HREF.some(s=>href.includes(s))) return;
      if(cands.length<3) cands.push({t:a.textContent.trim(),u:new URL(href,"https://dlpsgame.com").href});
    });
    if(!cands.length){ if(st) st.textContent="Sin resultados para "+nc; return; }
    if(st) st.textContent="Cargando ficha…";
    const gHtml=await fetchTextLive(cands[0].u);
    const parsed=parseGameLive(gHtml,cands[0].u,nc);
    const show=parsed.filtrados.length?parsed.filtrados:parsed.bloques;
    if(st) st.textContent="";
    renderResults(show,nc);
  }catch(e){
    if(st) st.textContent="Falló: "+e.message;
  }
}
async function init(){
  const foot=document.getElementById("foot");
  try{
    const rj=await fetch("data/juegos.min.json",{cache:"no-store"});
    if(rj.ok) JUEGOS=await rj.json();
    else throw 0;
  }catch(e){
    try{ const r2=await fetch("data/juegos.json",{cache:"no-store"}); if(r2.ok) JUEGOS=await r2.json(); }catch(e2){}
  }
  try{ const r=await fetch("data/cusa_idiomas.json",{cache:"no-store"}); if(r.ok) ROWS=await r.json(); }catch(e){}
  BY_CUSA=new Map();
  ROWS.forEach(r=>{ const k=(r.cusa||"").toUpperCase(); if(!k) return; if(!BY_CUSA.has(k)) BY_CUSA.set(k,[]); BY_CUSA.get(k).push(r); });
  renderStats();
  foot.textContent="Consulta en vivo";
  document.getElementById("out").innerHTML='<div class="card"><h2>Empieza a buscar</h2><p class="mut">Ejemplo: CUSA43772 o “mortuary”.</p></div>';
  if(location.hash){
    const h=decodeURIComponent(location.hash.slice(1));
    if(h){ document.getElementById("q").value=h; buscar(); }
  }
}
document.getElementById("go").onclick=buscar;
document.getElementById("clear").onclick=()=>{document.getElementById("q").value="";document.getElementById("liveStatus").textContent="";document.getElementById("out").innerHTML="";document.getElementById("q").focus();};
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")buscar();});
window.buscar=buscar; window.buscarEnVivo=buscarEnVivo; window.verJuego=verJuego;
init();
</script>
